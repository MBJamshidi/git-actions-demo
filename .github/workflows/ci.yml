name: CI and Fake CD Demo

on: [push]

jobs:
  # JOB 1: The CI (Testing)
  test-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        run: python app.py

  # JOB 2: The CD (Deployment)
  deploy-to-production:
    runs-on: ubuntu-latest
    needs: test-logic  # CRITICAL: This link makes it a pipeline!
    if: github.ref == 'refs/heads/main' # Only deploy if we are on the main branch
    
    steps:
      - name: Simulating Deployment
        run: |
          echo "Connecting to Production Server..."
          echo "Uploading code..."
          echo "Deployment Successful! Version ${{ github.sha }} is live."

